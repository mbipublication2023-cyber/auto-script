name: Run MBI Checkout Script

on:
  workflow_dispatch:   # Manual run (via button)
  schedule:
    - cron: "0 */6 * * *"   # Run every 6 hours

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run script
        run: node add_to_cart_mbi.js

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-screenshot
          path: |
            final_checkout_debug.png
            fatal_error.png
          if-no-files-found: ignore
